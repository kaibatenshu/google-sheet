<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="unitGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </radialGradient>
  </defs>

  <!-- Khung viền -->
  <rect x="2" y="2" width="96" height="96" rx="14" fill="url(#unitGlow)" stroke="#0284c7" stroke-width="2.5" />
  <rect x="5" y="5" width="90" height="90" rx="11" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.2" />

  <!-- Huy hiệu thời kỳ ở góc -->
  <circle cx="82" cy="18" r="8" fill="#0284c7" />
  <circle cx="82" cy="18" r="7" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.6" />

  <!-- Biểu tượng chính -->
  <text x="50" y="52" font-family="'Segoe UI Emoji', 'Apple Color Emoji', sans-serif" font-size="44" text-anchor="middle" dominant-baseline="central">🏹</text>

  <!-- Thanh nhãn bên dưới -->
  <rect x="8" y="76" width="84" height="16" rx="4" fill="#000000" fill-opacity="0.65" stroke="#0284c7" stroke-width="0.5" />
  <text x="50" y="87" font-family="'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#ffffff" letter-spacing="0.3">Cung Trần</text>
</svg>