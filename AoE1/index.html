<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AOE 1 Cẩm Nang Toàn Thư | Ma Trận Binh Chủng 16 Quốc Gia</title>
  <meta name="description" content="Tra cứu ma trận chỉ số quân 4 đời chuẩn Google Sheet cho 16 quốc gia trong Age of Empires 1 (Đế Chế 1).">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="fullwidth-layout">

  <!-- HEADER -->
  <header class="header-fullwidth">
    <div class="header-title-bar">
      <div class="brand-pill">
        <span>🏛️</span>
        <span>Age of Empires 1 • Rise of Rome</span>
      </div>
      <h1 class="site-title">AOE 1 CẨM NANG MA TRẬN BINH CHỦNG</h1>
    </div>

    <!-- 16 TABS CHỌN QUỐC GIA (CLICK VÀO ĐỂ XEM QUÂN & CHỈ SỐ) -->
    <nav class="civ-tabs-nav">
      <div class="civ-tabs-bar" id="civTabsBar">
        <!-- Render 16 quốc gia bằng JS: Shang, Assyrian, Egyptian, Babylonian... -->
      </div>
    </nav>
  </header>

  <!-- MAIN CONTAINER (FULLWIDTH) -->
  <main class="main-fullwidth">
    <!-- BẢNG TÍNH MA TRẬN CHỈ SỐ QUÂN (FULLWIDTH, CHỈ CUỘN NGANG KHI TRÀN, 1 THANH CUỘN DỌC TRANG DUY NHẤT) -->
    <section class="spreadsheet-container" id="spreadsheetContainer">
      <table class="aoe-spreadsheet" id="matrixTable">
        <!-- Render tự động bởi app.js theo mẫu bảng tính Google Sheet -->
      </table>
    </section>
  </main>

  <!-- FOOTER -->
  <footer>
    <p>AOE 1 Cẩm Nang Toàn Thư • Ma Trận Binh Chủng 16 Quốc Gia Chuẩn In-Game</p>
    <p style="margin-top: 4px; color: var(--text-dim); font-size: 0.8rem;">Dữ liệu chuẩn thi đấu Việt Nam - Trung Quốc • Giao diện tĩnh 100%</p>
  </footer>

  <!-- Scripts -->
  <script src="data.js"></script>
  <script src="matrix_data.js"></script>
  <script src="app.js"></script>
</body>
</html>
